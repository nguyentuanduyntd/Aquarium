<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab Aquarium – store art</title>
<!-- Vẽ logo & promo tile cho store bằng chính hàm vẽ cá của extension.
     Mở qua http server: tools/art.html?kind=logo | small | large -->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { drawCreature } from '../engine/fish.js';

const kind = new URLSearchParams(location.search).get('kind') || 'logo';
const SIZES = { logo: [300, 300], small: [440, 280], large: [1400, 560] };
const [W, H] = SIZES[kind];
const c = document.getElementById('c');
c.width = W; c.height = H;
const g = c.getContext('2d');
const FONT = '"Segoe UI", system-ui, -apple-system, sans-serif';
const TITLE = 'Tab Aquarium';
const SLOGAN = 'Your tabs, as a living aquarium.';

// mulberry32 – số ngẫu nhiên cố định để ảnh lần nào cũng giống nhau
let seed = 7;
const rnd = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

function roundRect(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function water() {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#5fd3f0'); gr.addColorStop(0.45, '#1d8fc4'); gr.addColorStop(1, '#0a4f7e');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // tia nắng
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const x = W * (0.1 + i * 0.22), w = W * 0.07;
    const lg = g.createLinearGradient(0, 0, 0, H * 0.9);
    lg.addColorStop(0, 'rgba(255,255,255,0.16)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lg;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + w, 0); g.lineTo(x + w * 2.2 - W * 0.08, H); g.lineTo(x - W * 0.08, H); g.closePath(); g.fill();
  }
  g.restore();
}

function sand(h) {
  const y0 = H - h;
  g.fillStyle = '#e9cf98';
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W; x += 6) g.lineTo(x, y0 + Math.sin(x / W * Math.PI * 2.2 + 0.6) * h * 0.18);
  g.lineTo(W, H); g.closePath(); g.fill();
  g.fillStyle = 'rgba(160,120,70,0.35)';
  for (let i = 0; i < W / 9; i++) { g.beginPath(); g.arc(rnd() * W, y0 + h * 0.35 + rnd() * h * 0.6, 0.8 + rnd() * 1.6, 0, Math.PI * 2); g.fill(); }
}

function weed(x, base, h, col, sway) {
  g.strokeStyle = col; g.lineCap = 'round'; g.lineWidth = Math.max(3, h * 0.07);
  g.beginPath(); g.moveTo(x, base);
  g.bezierCurveTo(x + sway, base - h * 0.35, x - sway, base - h * 0.7, x + sway * 0.6, base - h);
  g.stroke();
}

function bubble(x, y, r) {
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = Math.max(1.2, r * 0.18);
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.75)';
  g.beginPath(); g.arc(x - r * 0.35, y - r * 0.35, r * 0.22, 0, Math.PI * 2); g.fill();
}

function fish(species, pal, x, y, L, face = 1, phase = 1) {
  g.save(); g.translate(x, y); g.scale(face, 1);
  drawCreature(g, species, pal, {
    L, phase, tailAmp: 0.18, fat: 1, thin: 1, eat: 0, eyeClose: 0, deadEye: false, desat: 0, dead: 0, dim: 0,
    fav: null, letter: '', badgeCol: 'transparent', noBadge: true, fx: face, fy: 1, group: null, t: 0, seed: 3, finA: 0.85
  });
  g.restore();
}

function text(str, x, y, size, weight, color, align = 'left', shadow = true) {
  g.font = `${weight} ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'alphabetic';
  if (shadow) { g.shadowColor = 'rgba(0,30,60,0.45)'; g.shadowBlur = size * 0.25; g.shadowOffsetY = size * 0.06; }
  g.fillStyle = color; g.fillText(str, x, y);
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
}

if (kind === 'logo') {
  roundRect(0, 0, W, H, 64); g.save(); g.clip();
  water(); sand(56);
  weed(46, H - 40, 120, '#2fa36b', 10); weed(62, H - 36, 84, '#46c486', -8);
  weed(258, H - 38, 104, '#2fa36b', -10);
  bubble(214, 58, 13); bubble(240, 34, 8); bubble(252, 78, 6);
  fish('clown', 0, 146, 150, 200, 1, 1.2);
  g.restore();
} else if (kind === 'small') {
  water(); sand(46);
  weed(30, H - 30, 90, '#2fa36b', 8); weed(410, H - 30, 80, '#46c486', -8);
  bubble(312, 44, 9); bubble(330, 24, 5);
  fish('clown', 0, 220, 96, 150, 1, 1.2);
  text(TITLE, W / 2, 196, 40, 700, '#ffffff', 'center');
  text(SLOGAN, W / 2, 228, 18, 500, '#e6f8ff', 'center');
} else {
  water(); sand(70);
  for (const [x, h, col, s] of [[70, 200, '#2fa36b', 14], [100, 150, '#46c486', -12], [1340, 220, '#2fa36b', -14], [1300, 160, '#46c486', 12], [880, 130, '#3bb37a', 10]]) weed(x, H - 50, h, col, s);
  for (const [x, y, r] of [[1120, 70, 16], [1150, 38, 10], [1175, 96, 7], [760, 110, 9], [780, 80, 6]]) bubble(x, y, r);
  fish('angel', 0, 1010, 170, 190, -1, 0.6);
  fish('betta', 1, 1230, 300, 170, -1, 2.0);
  fish('puffer', 0, 860, 360, 130, 1, 0.4);
  fish('clown', 0, 1080, 400, 230, -1, 1.2);
  text(TITLE, 110, 250, 96, 700, '#ffffff');
  text(SLOGAN, 114, 312, 38, 500, '#e6f8ff');
  text('Heavy tabs grow big · Idle tabs get hungry', 116, 372, 26, 400, 'rgba(230,248,255,0.85)');
}
document.title = 'ready';
</script>
</body>
</html>
